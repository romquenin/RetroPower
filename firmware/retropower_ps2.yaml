# =============================================================
# RetroPower — PS2 fat (momentary power button)
# The relay is NOT left closed: it simulates a button PRESS
# (J4 wired in parallel with the two contacts of the Power button).
# esphome-device-builder C:\RetroPowerTest
# =============================================================

substitutions:
  device_name: "retropower-ps2"
  friendly_name: "PS2 Power"
  press_on_ms: "300"      # short press: power on
  press_off_ms: "3000"    # long press: power off (PS2 = held press, adjust when testing)
  press_reset_ms: "300"   # short press while the console is on: game reset
  press_force_ms: "6000"  # long press: forced power off, whatever POWER_SENSE says

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # At boot, make sure the contact is OPEN. The bistable relay keeps its last
  # position: if it was left closed it would hold the button pressed.
  # Opening the contact never presses the button.
  on_boot:
    priority: -100
    then:
      - delay: 1s
      - script.execute: pulse_reset

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    version: 5.5.1

# --- Connectivity ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  # Static IP: use a DIFFERENT address for each board/console!
  manual_ip:
    static_ip: 192.168.2.239
    gateway: 192.168.2.1
    subnet: 255.255.255.0

api:

ota:
  - platform: esphome

logger:

# =============================================================
# RetroPower hardware
# GPIO0  = POWER_SENSE  (about 3.3 V only while the console is on)
# GPIO3  = RELAY_SET    (pulse -> closes the contact = press)
# GPIO10 = RELAY_RESET  (pulse -> opens the contact = release)
# =============================================================

output:
  - platform: gpio
    pin: GPIO3
    id: relay_set_pin
  - platform: gpio
    pin: GPIO10
    id: relay_reset_pin

binary_sensor:
  - platform: gpio
    id: power_sense
    name: "${friendly_name} - Console on (sensor)"
    pin:
      number: GPIO0
      mode: INPUT
      # high = on, low = off
    filters:
      - delayed_on_off: 50ms   # debounce / noise filter

script:
  # Pulses on the bistable relay coils: 100 ms (30 ms is near the minimum and was
  # not reliable enough: a missed RESET leaves the contact closed = held button)
  - id: pulse_set
    then:
      - output.turn_on: relay_set_pin
      - delay: 100ms
      - output.turn_off: relay_set_pin

  - id: pulse_reset
    then:
      - output.turn_on: relay_reset_pin
      - delay: 100ms
      - output.turn_off: relay_reset_pin

  # Simulates a press of "hold_ms" milliseconds on the Power button:
  # contact closed (SET) -> wait -> contact reopened (RESET).
  - id: press_button
    mode: single              # ignore a new order while a press is in progress
    parameters:
      hold_ms: int
    then:
      - script.execute: pulse_set
      - delay: !lambda 'return hold_ms;'
      - script.execute: pulse_reset

# Switch exposed to Home Assistant.
# Its state always follows POWER_SENSE. We only press if the console is not
# already in the requested state: otherwise a single press would do the
# opposite of what was asked (on a PS2 a short press while on = game reset).
switch:
  - platform: template
    name: "${friendly_name}"
    id: console_power
    optimistic: false
    lambda: |-
      return id(power_sense).state;
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_off: power_sense
          then:
            - script.execute:
                id: press_button
                hold_ms: ${press_on_ms}
    turn_off_action:
      - if:
          condition:
            binary_sensor.is_on: power_sense
          then:
            - script.execute:
                id: press_button
                hold_ms: ${press_off_ms}

# "Reset" button for Home Assistant: short press on Power while the console
# is ON. Does nothing if the console is off, so it never powers it on by mistake.
# Note: the PS2 disables its reset button while a hard drive is connected
# (see docs/consoles/ps2.md), so this button does nothing on such a console.
button:
  - platform: template
    name: "${friendly_name} - Reset"
    on_press:
      - if:
          condition:
            binary_sensor.is_on: power_sense
          then:
            - script.execute:
                id: press_button
                hold_ms: ${press_reset_ms}

  # "Force off" button: long press on Power WITHOUT checking POWER_SENSE.
  # Use it when the console is stuck, or when the sense input is wrong
  # (e.g. the console is on but Home Assistant says it is off).
  # Warning: if the console is really off, the press turns it ON, so only use
  # this button on a console that is running.
  - platform: template
    name: "${friendly_name} - Force off"
    on_press:
      - script.execute:
          id: press_button
          hold_ms: ${press_force_ms}

# Useful diagnostics (optional)
sensor:
  - platform: wifi_signal
    name: "${friendly_name} - WiFi signal"
    update_interval: 60s

  - platform: uptime
    name: "${friendly_name} - Uptime"
