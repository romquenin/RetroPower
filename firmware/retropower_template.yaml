# =============================================================
# RetroPower - generic ESPHome template (validated on a SNES)
# Duplicate for each console: change device_name, friendly_name
# and the static IP (one unique IP per console).
# =============================================================

substitutions:
  device_name: "retropower-snes"   # e.g. retropower-snes, retropower-gamecube...
  friendly_name: "SNES Power"      # name shown in Home Assistant

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # The relay is bistable: it keeps its last position without power. After a
  # power cut or reboot it may still be closed, which turns the console on as
  # soon as it is plugged in. If the sense input says "off" 3 s after boot,
  # send a RESET pulse so the relay is open again.
  # Only keep this if POWER_SENSE is reliable on your console, otherwise a
  # reboot (e.g. an OTA update) could switch a running console off.
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - if:
          condition:
            binary_sensor.is_off: power_sense
          then:
            - script.execute: pulse_reset

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: 192.168.2.230   # adjust to your network, unique per console
    gateway: 192.168.2.1
    subnet: 255.255.255.0

api:

ota:
  - platform: esphome

logger:

# GPIO0  = POWER_SENSE (console 3V3 rail, high = on)
# GPIO3  = RELAY_SET   (pulse -> on, via Q1)
# GPIO10 = RELAY_RESET (pulse -> off, via Q2)
output:
  - platform: gpio
    pin: GPIO3
    id: relay_set_pin
  - platform: gpio
    pin: GPIO10
    id: relay_reset_pin

binary_sensor:
  - platform: gpio
    id: power_sense
    name: "${friendly_name} - Console on (sensor)"
    pin:
      number: GPIO0
      mode: INPUT
    filters:
      - delayed_on_off: 50ms

# 100 ms pulses on the bistable relay coils (30 ms worked on some consoles,
# but 100 ms is more reliable and gave a cleaner power-off on others)
script:
  - id: pulse_set
    then:
      - output.turn_on: relay_set_pin
      - delay: 100ms
      - output.turn_off: relay_set_pin
  - id: pulse_reset
    then:
      - output.turn_on: relay_reset_pin
      - delay: 100ms
      - output.turn_off: relay_reset_pin

# State always reflects reality (POWER_SENSE), even when the
# console is switched by its physical button.
switch:
  - platform: template
    name: "${friendly_name}"
    id: console_power
    optimistic: false
    lambda: |-
      return id(power_sense).state;
    turn_on_action:
      - script.execute: pulse_set
    turn_off_action:
      - script.execute: pulse_reset

sensor:
  - platform: wifi_signal
    name: "${friendly_name} - WiFi signal"
    update_interval: 60s
  - platform: uptime
    name: "${friendly_name} - Uptime"
