# =============================================================
# RetroPower — Template ESPHome générique
# À dupliquer pour chaque console : changer device_name / friendly_name
# =============================================================

substitutions:
  device_name: "retropower-snes"        # ex: retropower-snes, retropower-gamecube...
  friendly_name: "SNES Power"           # nom affiché dans Home Assistant

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# --- Connectivité ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Point d'accès de secours si le Wi-Fi ne répond pas
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

# =============================================================
# Matériel RetroPower
# GPIO0  = POWER_SENSE  (lecture du rail 3V3 de la console)
# GPIO3  = RELAY_SET    (impulsion -> allume, via Q1)
# GPIO10 = RELAY_RESET  (impulsion -> éteint, via Q2)
# =============================================================

output:
  - platform: gpio
    pin: GPIO3
    id: relay_set_pin
  - platform: gpio
    pin: GPIO10
    id: relay_reset_pin

binary_sensor:
  - platform: gpio
    id: power_sense
    name: "${friendly_name} - Console allumée (capteur)"
    pin:
      number: GPIO0
      mode: INPUT
      # Pas de pull interne : la ligne est pilotée activement
      # par le rail 3V3 de la console (haut = allumée, bas = éteinte)
    filters:
      - delayed_on_off: 50ms   # anti-rebond / anti-parasite

# Impulsions courtes (30ms) sur les bobines SET / RESET du relais
# bistable, cohérent avec le courant bobine (~65mA, <25ms mini)
script:
  - id: pulse_set
    then:
      - output.turn_on: relay_set_pin
      - delay: 30ms
      - output.turn_off: relay_set_pin

  - id: pulse_reset
    then:
      - output.turn_on: relay_reset_pin
      - delay: 30ms
      - output.turn_off: relay_reset_pin

# Interrupteur exposé à Home Assistant.
# Son état reflète toujours la réalité (via POWER_SENSE),
# même si on allume/éteint la console avec le bouton physique.
switch:
  - platform: template
    name: "${friendly_name}"
    id: console_power
    optimistic: false
    lambda: |-
      return id(power_sense).state;
    turn_on_action:
      - script.execute: pulse_set
    turn_off_action:
      - script.execute: pulse_reset

# Diagnostics utiles (optionnel mais pratique en cas de souci)
sensor:
  - platform: wifi_signal
    name: "${friendly_name} - Signal Wi-Fi"
    update_interval: 60s

  - platform: uptime
    name: "${friendly_name} - Uptime"
