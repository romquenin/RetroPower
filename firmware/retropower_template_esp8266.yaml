# =============================================================
# RetroPower - generic ESPHome template, ESP8266 / D1 mini version
# (validated on a Master System)
#
# Same hardware and same logic as retropower_template.yaml, with a D1 mini
# soldered in place of the ESP32-C3-Zero. Useful when a C3 module turns out
# to have a poor antenna, or when a D1 mini is simply what you have.
#
# The D1 mini does NOT fit the integrated board's footprint: its header rows
# are 22.86 mm apart instead of 15.24 mm. It is five flying wires.
# See docs/consoles/master-system.md for identifying the five pads by
# continuity on an already-assembled board.
#
# Pin mapping, ESP32-C3-Zero -> D1 mini:
#   POWER_SENSE  GPIO0  -> D5 (GPIO14)
#   RELAY_SET    GPIO3  -> D1 (GPIO5)
#   RELAY_RESET  GPIO10 -> D2 (GPIO4)
#
# The C3's GPIO numbers cannot be reused: on an ESP8266 GPIO0 is a boot
# strapping pin, GPIO3 is the serial RX, and GPIO10 is not brought out on a
# D1 mini. The three pins above have no boot constraints.
#
# The D-labels are silkscreen only and have nothing to do with the GPIO
# numbers. Always write the GPIO number in the YAML.
#
# Duplicate for each console: change device_name, friendly_name
# and the static IP (one unique IP per console).
# =============================================================

substitutions:
  device_name: "retropower-mastersystem"
  friendly_name: "Master System Power"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # The relay is bistable: it keeps its last position without power. After a
  # power cut or reboot it may still be closed, which turns the console on as
  # soon as it is plugged in. If the sense input says "off" 3 s after boot,
  # send a RESET pulse so the relay is open again.
  # Only keep this if POWER_SENSE is reliable on your console, otherwise a
  # reboot (e.g. an OTA update) could switch a running console off.
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - if:
          condition:
            binary_sensor.is_off: power_sense
          then:
            - script.execute: pulse_reset

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 20dB
  manual_ip:
    static_ip: 192.168.2.235   # adjust to your network, unique per console
    gateway: 192.168.2.1
    subnet: 255.255.255.0

api:

ota:
  - platform: esphome

logger:

# D5 / GPIO14 = POWER_SENSE (console 3V3 rail, high = on)
# D1 / GPIO5  = RELAY_SET   (pulse -> on, via Q1)
# D2 / GPIO4  = RELAY_RESET (pulse -> off, via Q2)
output:
  - platform: gpio
    pin: GPIO5
    id: relay_set_pin
  - platform: gpio
    pin: GPIO4
    id: relay_reset_pin

binary_sensor:
  - platform: gpio
    id: power_sense
    name: "${friendly_name} - Console on (sensor)"
    pin:
      number: GPIO14
      mode: INPUT
    filters:
      - delayed_on_off: 50ms

# 100 ms pulses on the bistable relay coils
script:
  - id: pulse_set
    then:
      - output.turn_on: relay_set_pin
      - delay: 100ms
      - output.turn_off: relay_set_pin
  - id: pulse_reset
    then:
      - output.turn_on: relay_reset_pin
      - delay: 100ms
      - output.turn_off: relay_reset_pin

# State always reflects reality (POWER_SENSE), even when the
# console is switched by its physical button.
switch:
  - platform: template
    name: "${friendly_name}"
    id: console_power
    optimistic: false
    lambda: |-
      return id(power_sense).state;
    turn_on_action:
      - script.execute: pulse_set
    turn_off_action:
      - script.execute: pulse_reset

sensor:
  - platform: wifi_signal
    name: "${friendly_name} - WiFi signal"
    update_interval: 60s
  - platform: uptime
    name: "${friendly_name} - Uptime"
